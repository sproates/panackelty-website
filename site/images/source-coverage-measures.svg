<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1010" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">One source example, three coverage views</title>
  <desc id="diagram-description">The classify function checks whether a value is at least ten. If the measured test calls classify with twelve, the function is covered, the condition's source line is reached, and the true outcome is covered. If the false outcome is never taken, it is a known zero.</desc>
  <rect x="1" y="1" width="718" height="1008" rx="12" fill="#1d1a15" stroke="#373127" stroke-width="2"/>
  <text x="42" y="52" fill="#9aa7ff" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">ONE TEST, THREE COVERAGE VIEWS</text>
  <text x="42" y="94" fill="#f7f1e5" font-family="Georgia, serif" font-size="30">What did classify(12) reach?</text>

  <g font-family="Arial, sans-serif">
    <rect x="42" y="123" width="636" height="286" rx="8" fill="#252119" stroke="#51483b" stroke-width="2"/>
    <text x="68" y="158" fill="#b8b0a1" font-size="14" font-weight="700" letter-spacing="1.4">SOURCE CODE</text>
    <g font-family="Menlo, Consolas, monospace" font-size="18">
      <text x="70" y="200" fill="#776f62">1</text><text x="105" y="200" fill="#f7f1e5">pure classify(value: Nat): Str {</text>
      <text x="70" y="233" fill="#776f62">2</text><text x="105" y="233" fill="#9aa7ff">  if value &gt;= 10 {</text>
      <text x="70" y="266" fill="#776f62">3</text><text x="105" y="266" fill="#f7f1e5">    "large"</text>
      <text x="70" y="299" fill="#776f62">4</text><text x="105" y="299" fill="#b8b0a1">  } else {</text>
      <text x="70" y="332" fill="#776f62">5</text><text x="105" y="332" fill="#b8b0a1">    "small"</text>
      <text x="70" y="365" fill="#776f62">6</text><text x="105" y="365" fill="#b8b0a1">  }</text>
      <text x="70" y="398" fill="#776f62">7</text><text x="105" y="398" fill="#f7f1e5">}</text>
    </g>

    <text x="42" y="452" fill="#65d7d0" font-size="14" font-weight="700" letter-spacing="1.5">MEASURED RUN: classify(12), with no call below 10</text>

    <rect x="42" y="476" width="636" height="112" rx="8" fill="#252119" stroke="#51483b" stroke-width="2"/>
    <text x="68" y="510" fill="#9aa7ff" font-size="14" font-weight="700" letter-spacing="1.3">FUNCTION</text>
    <text x="68" y="548" fill="#f7f1e5" font-size="20" font-weight="700">classify was entered</text>
    <rect x="506" y="511" width="142" height="43" rx="6" fill="#193a34" stroke="#65d7d0"/>
    <text x="531" y="539" fill="#65d7d0" font-size="15" font-weight="700">COVERED</text>

    <rect x="42" y="604" width="636" height="112" rx="8" fill="#252119" stroke="#51483b" stroke-width="2"/>
    <text x="68" y="638" fill="#9aa7ff" font-size="14" font-weight="700" letter-spacing="1.3">SOURCE LINE</text>
    <text x="68" y="676" fill="#f7f1e5" font-size="19" font-weight="700">Line 2: if value &gt;= 10</text>
    <rect x="506" y="639" width="142" height="43" rx="6" fill="#193a34" stroke="#65d7d0"/>
    <text x="531" y="667" fill="#65d7d0" font-size="15" font-weight="700">REACHED</text>

    <rect x="42" y="732" width="636" height="154" rx="8" fill="#252119" stroke="#51483b" stroke-width="2"/>
    <text x="68" y="766" fill="#9aa7ff" font-size="14" font-weight="700" letter-spacing="1.3">SOURCE OUTCOMES</text>
    <text x="68" y="811" fill="#f7f1e5" font-size="18">true · value is at least 10</text>
    <rect x="506" y="783" width="142" height="41" rx="6" fill="#193a34" stroke="#65d7d0"/>
    <text x="531" y="810" fill="#65d7d0" font-size="14" font-weight="700">COVERED</text>
    <text x="68" y="858" fill="#f7f1e5" font-size="18">false · value is below 10</text>
    <rect x="493" y="833" width="155" height="41" rx="6" fill="#302b45" stroke="#9aa7ff"/>
    <text x="510" y="860" fill="#c2c8ff" font-size="14" font-weight="700">KNOWN ZERO</text>

    <text x="42" y="933" fill="#b8b0a1" font-size="16">A hit shows that code ran. An assertion must still check</text>
    <text x="42" y="959" fill="#b8b0a1" font-size="16">whether classify returned the right text.</text>
    <text x="42" y="988" fill="#65d7d0" font-size="14" font-weight="700" letter-spacing="1">SOURCE DECISIONS, NOT BYTECODE BRANCHES</text>
  </g>
</svg>
