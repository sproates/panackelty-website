name: Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reuse:
    name: Find validated website
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.candidate.outputs.run_id }}
      attempt: ${{ steps.candidate.outputs.attempt }}
      artifact_name: ${{ steps.candidate.outputs.artifact_name }}
      artifact_id: ${{ steps.candidate.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Find successful PR validation for this source tree
        id: candidate
        uses: actions/github-script@v8
        with:
          script: |
            const tree = require('node:child_process').execFileSync('git', ['rev-parse', 'HEAD^{tree}'], {encoding:'utf8'}).trim();
            try {
              const candidate = await require('./scripts/reuse_website_candidate.cjs').findCandidate(github, context, tree);
              if (candidate) for (const [key, value] of Object.entries(candidate)) core.setOutput(key, value);
              else core.info('No matching validated artifact; running fresh validation.');
            } catch (error) {
              core.warning(`Artifact lookup unavailable; running fresh validation: ${error.message}`);
            }

  prepare:
    name: Website assembly
    needs: reuse
    if: needs.reuse.outputs.run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      browser_mode: ${{ steps.scope.outputs.mode }}
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Identify candidate source tree and attempt
        id: identity
        run: echo "artifact_name=pages-candidate-$(git rev-parse 'HEAD^{tree}')-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Select browser coverage
        id: scope
        env:
          SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: echo "mode=$(node scripts/browser_scope.cjs)" >> "$GITHUB_OUTPUT"
      - name: Read pinned preview tool revision
        id: preview-tool
        run: node -e 'console.log("revision=" + require("./preview-tool.json").revision)' >> "$GITHUB_OUTPUT"
      - name: Check out pinned preview tool source
        uses: actions/checkout@v6
        with:
          repository: sproates/panackelty
          ref: ${{ steps.preview-tool.outputs.revision }}
          path: build/preview-tool-source
          persist-credentials: false
      - name: Install native tool build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libcurl4-openssl-dev
      - name: Build the preview tool once
        run: |
          make -C build/preview-tool-source -j2 install PREFIX="$GITHUB_WORKSPACE/build/preview-tool"
          echo "PANACK_HTTP_SERVER=$GITHUB_WORKSPACE/build/preview-tool/bin/panack-http-server" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: preview-tool
          overwrite: true
          path: build/preview-tool
          if-no-files-found: error
          retention-days: 1
      - run: make check
      - run: make build
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: build/website
          if-no-files-found: error
          retention-days: 7
      - name: Prepare review preview
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/preview.cjs build build/preview
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'pull_request'
        with:
          name: website-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/preview
          if-no-files-found: error
          retention-days: 7

  release:
    name: Published release integrity
    needs: reuse
    if: needs.reuse.outputs.run_id == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: make release-check

  browser:
    needs: [reuse, prepare]
    if: needs.reuse.outputs.run_id == '' && needs.prepare.result == 'success'
    uses: ./.github/workflows/browser-validation.yml
    with:
      mode: ${{ needs.prepare.outputs.browser_mode }}
      artifact_name: ${{ needs.prepare.outputs.artifact_name }}
    permissions:
      contents: read
      actions: read

  checks:
    name: Website checks
    if: always()
    needs: [reuse, prepare, release, browser]
    runs-on: ubuntu-24.04
    steps:
      - name: Require all website validation
        env:
          LOOKUP: ${{ needs.reuse.result }}
          REUSED_RUN: ${{ needs.reuse.outputs.run_id }}
          ASSEMBLY: ${{ needs.prepare.result }}
          RELEASE: ${{ needs.release.result }}
          BROWSER: ${{ needs.browser.result }}
        run: |
          test "$LOOKUP" = success
          if [ -n "$REUSED_RUN" ]; then
            test "$ASSEMBLY" = skipped && test "$RELEASE" = skipped && test "$BROWSER" = skipped
          else
            test "$ASSEMBLY" = success && test "$RELEASE" = success && test "$BROWSER" = success
          fi

  publish:
    name: Publish website
    if: always() && needs.checks.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [reuse, prepare, checks]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Recheck reused validation before downloading
        if: needs.reuse.outputs.run_id != ''
        uses: actions/github-script@v8
        env:
          CANDIDATE: ${{ toJSON(needs.reuse.outputs) }}
        with:
          script: |
            const tree = require('node:child_process').execFileSync('git', ['rev-parse', 'HEAD^{tree}'], {encoding:'utf8'}).trim();
            await require('./scripts/reuse_website_candidate.cjs').verifyCandidate(github, context, JSON.parse(process.env.CANDIDATE), tree);
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.reuse.outputs.artifact_name || needs.prepare.outputs.artifact_name }}
          run-id: ${{ needs.reuse.outputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: build/website
      - uses: actions/checkout@v6
        with:
          path: validation-source
          persist-credentials: false
      - name: Record exact validated source
        env:
          SOURCE_SHA: ${{ github.sha }}
          CHECK_RUN: ${{ needs.reuse.outputs.run_id || github.run_id }}
          CHECK_ATTEMPT: ${{ needs.reuse.outputs.attempt || github.run_attempt }}
          PUBLICATION_RUN: ${{ github.run_id }}
        run: |
          node -e 'require("node:fs").writeFileSync("build/website/publication.json",JSON.stringify({schema:1,site_sha:process.env.SOURCE_SHA,check_run:Number(process.env.CHECK_RUN),check_attempt:Number(process.env.CHECK_ATTEMPT),publication_run:Number(process.env.PUBLICATION_RUN)},null,2)+"\n")'
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: build/website
      - name: Require current main immediately before deployment
        uses: actions/github-script@v8
        with:
          script: |
            await require('./validation-source/scripts/require_current_main.cjs')(github, context);
      - uses: actions/deploy-pages@v5
        id: deploy
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify deployed website bytes and provenance
        env:
          WEBSITE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          for attempt in 1 2 3 4 5; do
            if node validation-source/scripts/check_pages.cjs build/website "$WEBSITE_URL"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
