name: Browser validation

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: full

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Browser integration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pages-candidate
          path: build/website

      - name: Check out the reviewed browser integration suite
        uses: actions/checkout@v6
        with:
          repository: sproates/panackelty-browser
          ref: acf15fe373230a8c7fdc22464a930a19c96dae17
          path: build/browser-tests
          persist-credentials: false

      - name: Check out website navigation tests
        uses: actions/checkout@v6
        with:
          path: build/website-tests
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: preview-tool
          path: build/preview-tool

      - name: Configure the actual preview server for both suites
        run: |
          chmod +x build/preview-tool/bin/* build/preview-tool/libexec/panackelty/panack-vm
          echo "PANACK_HTTP_SERVER=$GITHUB_WORKSPACE/build/preview-tool/bin/panack-http-server" >> "$GITHUB_ENV"
          echo "PANACK_PREVIEW_SCRIPT=$GITHUB_WORKSPACE/build/website-tests/scripts/preview.cjs" >> "$GITHUB_ENV"
          cp build/website-tests/tests/preview.playwright.config.mjs build/browser-tests/

      - name: Install locked test package and verify prepared browsers
        run: |
          cd build/browser-tests
          npm ci --ignore-scripts --no-audit --no-fund
          node - <<'JS'
          const fs = require('node:fs');
          if (require('playwright/package.json').version !== '1.63.0') {
            throw new Error('Playwright package/image mismatch: update the prepared environment');
          }
          for (const name of ['chromium', 'firefox', 'webkit']) {
            if (!fs.existsSync(require('playwright')[name].executablePath())) {
              throw new Error(`Prepared browser missing: ${name}`);
            }
          }
          JS

      - name: Match mounted home ownership to the container user
        # GitHub mounts /github/home with host-user ownership. Firefox rejects
        # root execution with a home owned by another user; do not redefine HOME.
        run: chown "$(id -u):$(id -g)" /github/home

      - name: Test browser execution before publishing
        env:
          BROWSER_MODE: ${{ inputs.mode }}
        run: |
          export PLAYGROUND_SITE_DIR="$GITHUB_WORKSPACE/build/website"
          export PLAYGROUND_BUILD_DIR="$GITHUB_WORKSPACE/build/website/playground"
          cd build/browser-tests
          case "$BROWSER_MODE" in
            smoke) npx playwright test --config preview.playwright.config.mjs --workers=3 --grep 'footer resources|real worker compiles|homepage navigation' ;;
            full) npx playwright test --config preview.playwright.config.mjs --workers=3 ;;
            *) echo 'Invalid browser coverage mode' >&2; exit 1 ;;
          esac

      - name: Test editorial pages and mobile navigation
        run: |
          cp build/website-tests/tests/website.browser.mjs build/browser-tests/tests/
          cp build/website-tests/tests/website.playwright.config.mjs build/browser-tests/website.playwright.config.mjs
          export PLAYGROUND_SITE_DIR="$GITHUB_WORKSPACE/build/website"
          export PLAYGROUND_BUILD_DIR="$GITHUB_WORKSPACE/build/website/playground"
          cd build/browser-tests
          npx playwright test --config website.playwright.config.mjs --workers=3
